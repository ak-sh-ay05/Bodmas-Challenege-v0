<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BODMAS Challenge</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif}
#wrap{width:100%;border-radius:16px;overflow:hidden;background:#1e3a5f;min-height:560px;display:flex;flex-direction:column}

/* LOGIN */
#login-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:40px 20px;background:linear-gradient(135deg,#1e3a5f 0%,#1e40af 100%)}
#login-screen .logo{font-size:52px}
#login-screen h1{font-size:26px;font-weight:800;color:#fff;text-align:center;letter-spacing:.02em}
#login-screen p{font-size:14px;color:#93c5fd;text-align:center}
#login-box{background:#fff;border-radius:16px;padding:28px 32px;display:flex;flex-direction:column;gap:16px;width:100%;max-width:340px;box-shadow:0 8px 32px rgba(0,0,0,.25)}
#login-box label{font-size:13px;font-weight:700;color:#1e3a5f;letter-spacing:.04em;text-transform:uppercase}
#name-input{border:2.5px solid #cbd5e1;border-radius:10px;padding:12px 16px;font-size:16px;font-weight:600;color:#1e3a5f;outline:none;transition:border .2s;width:100%}
#name-input:focus{border-color:#2563eb}
#start-btn{background:#2563eb;color:#fff;border:none;border-radius:10px;padding:13px;font-size:16px;font-weight:700;cursor:pointer;transition:background .2s;letter-spacing:.03em}
#start-btn:hover{background:#1d4ed8}
#start-btn:active{background:#1e40af}
#name-error{color:#dc2626;font-size:12px;font-weight:600;display:none}

/* HEADER BAR */
#header-bar{background:#1e3a5f;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#greeting{font-size:14px;color:#93c5fd;font-weight:600}
#score-display{background:#2563eb;color:#fff;border-radius:20px;padding:5px 14px;font-size:13px;font-weight:700}
#logout-btn{background:transparent;border:1.5px solid #475569;color:#94a3b8;border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;transition:all .2s}
#logout-btn:hover{border-color:#fff;color:#fff}

/* STEP TRACK */
#step-track{display:flex;width:100%;height:56px;flex-shrink:0;border-bottom:3px solid #fff}
.step-hdr{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:2px solid #fff;gap:1px;transition:transform .4s,opacity .4s}
.step-hdr:last-child{border-right:none}
.step-key{font-size:14px;font-weight:800}
.step-name{font-size:8px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;text-align:center;padding:0 2px}

/* MAIN GAME */
#game{flex:1;display:flex;flex-direction:column}
.main-area{display:flex;flex:1}
.expr-panel{width:165px;flex-shrink:0;background:#f8fafc;border-right:3px solid #dde3ea;padding:10px 8px;display:flex;flex-direction:column;gap:7px}
.expr-panel h3{font-size:10px;color:#64748b;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.expr-btn{background:#fff;border:2.5px solid #cbd5e1;border-radius:10px;padding:8px 7px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;gap:3px;position:relative}
.expr-btn:hover{border-color:#3b82f6;transform:scale(1.02)}
.expr-btn:focus{outline:3px solid #3b82f6;outline-offset:2px}
.expr-btn.answered-correct{border-color:#16a34a;background:#f0fdf4}
.expr-btn.answered-wrong{border-color:#dc2626;background:#fff1f2}
.expr-btn.locked{opacity:.5;pointer-events:none}
.expr-math{font-size:14px;font-weight:700;color:#1e40af;font-family:monospace}
.expr-desc{font-size:10px;color:#475569;line-height:1.3}
.expr-tick{position:absolute;top:5px;right:7px;font-size:14px}

.center-col{flex:1;display:flex;flex-direction:column;min-width:0}
#anim-area{flex:1;position:relative;overflow:hidden;background:#e8eef4;min-height:300px}

/* ANSWER INPUT UI */
#answer-ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;z-index:30}
#question-display{font-size:22px;font-weight:800;font-family:monospace;color:#1e40af;background:#fff;border:3px solid #2563eb;border-radius:14px;padding:14px 28px;text-align:center}
#question-label{font-size:13px;color:#475569;font-weight:600;text-align:center}
#answer-row{display:flex;gap:10px;align-items:center}
#answer-input{border:2.5px solid #cbd5e1;border-radius:10px;padding:10px 16px;font-size:20px;font-weight:700;font-family:monospace;color:#1e3a5f;width:110px;text-align:center;outline:none;transition:border .2s}
#answer-input:focus{border-color:#2563eb}
#submit-btn{background:#2563eb;color:#fff;border:none;border-radius:10px;padding:10px 18px;font-size:15px;font-weight:700;cursor:pointer;transition:background .2s}
#submit-btn:hover{background:#1d4ed8}
#answer-feedback{font-size:14px;font-weight:700;text-align:center;min-height:22px;border-radius:8px;padding:4px 14px}

/* EXPLANATION ZONE */
#expr-box{position:absolute;left:50%;transform:translateX(-50%);top:16px;background:#fff;border:3px solid #3b82f6;border-radius:12px;padding:10px 20px;font-size:17px;font-family:monospace;font-weight:800;color:#1e40af;z-index:6;pointer-events:none;white-space:nowrap;transition:border-color .4s;display:none}
#op-area{position:absolute;left:50%;transform:translateX(-50%);top:90px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:10;opacity:0;transition:opacity .3s}
#op-pill{padding:8px 20px;border-radius:12px;font-size:15px;font-weight:700;border:3px solid;text-align:center;white-space:nowrap;font-family:monospace}
#op-badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 12px;border-radius:8px;border:2px solid}
#result-bubble{position:absolute;left:50%;transform:translateX(-50%);top:200px;padding:10px 24px;border-radius:14px;font-size:18px;font-weight:800;font-family:monospace;border:3px solid;pointer-events:none;z-index:10;opacity:0;transition:opacity .4s;white-space:nowrap}
#final-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);background:#fff;border:4px solid #16a34a;border-radius:16px;padding:16px 24px;text-align:center;pointer-events:none;z-index:25;opacity:0}
.confetti-dot{position:absolute;border-radius:50%;pointer-events:none;z-index:24}

#status-bar{background:#1e3a5f;color:#fff;font-size:13px;font-weight:600;padding:10px 16px;display:flex;align-items:center;gap:8px;min-height:44px;flex-shrink:0}
#status-icon{font-size:18px;flex-shrink:0}
#status-text{line-height:1.4}

.right-col{width:155px;flex-shrink:0;background:#f0fdf4;border-left:3px solid #dde3ea;display:flex;flex-direction:column}
.right-col h3{font-size:10px;color:#166534;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:10px 8px 5px}
#steps-list{padding:0 8px 8px;display:flex;flex-direction:column;gap:5px;overflow-y:auto}
.res-item{background:#fff;border:2px solid #bbf7d0;border-radius:8px;padding:7px 8px;font-size:11px;color:#166534;font-weight:600;opacity:.35;transition:all .5s}
.res-item.active{opacity:1;border-color:#16a34a;background:#dcfce7}
.res-step-name{font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.res-expr{font-size:11px;font-family:monospace;margin-bottom:1px}
.res-result{font-size:13px;font-weight:800;font-family:monospace}
</style>
</head>
<body>

<div id="wrap">

  <!-- LOGIN -->
  <div id="login-screen">
    <div class="logo">🔢</div>
    <h1>BODMAS Challenge</h1>
    <p>Learn the Order of Operations — step by step!</p>
    <div id="login-box">
      <label for="name-input">Your Name</label>
      <input id="name-input" type="text" placeholder="Type your name here..." maxlength="30" autocomplete="off"/>
      <div id="name-error">Please enter your name to continue.</div>
      <button id="start-btn">▶ Start Learning</button>
    </div>
  </div>

  <!-- GAME (hidden until login) -->
  <div id="game-screen" style="display:none;flex:1;flex-direction:column">

    <div id="header-bar">
      <div id="greeting">👋 Hello, <span id="student-name"></span>!</div>
      <div id="score-display">⭐ Score: <span id="score-val">0</span></div>
      <button id="logout-btn">↩ Exit</button>
    </div>

    <div id="step-track"></div>

    <div id="game">
      <div class="main-area">

        <div class="expr-panel">
          <h3>Questions</h3>
        </div>

        <div class="center-col">
          <div id="anim-area">
            <!-- answer input UI -->
            <div id="answer-ui" style="display:none">
              <div id="question-label">What is the answer to:</div>
              <div id="question-display"></div>
              <div id="answer-row">
                <input id="answer-input" type="number" placeholder="?" autocomplete="off"/>
                <button id="submit-btn">Check ✓</button>
              </div>
              <div id="answer-feedback"></div>
            </div>
            <!-- explanation elements -->
            <div id="expr-box"></div>
            <div id="op-area"><div id="op-pill"></div><div id="op-badge"></div></div>
            <div id="result-bubble"></div>
            <div id="final-card"></div>
          </div>
          <div id="status-bar"><span id="status-icon">💡</span><span id="status-text">Pick a question on the left!</span></div>
        </div>

        <div class="right-col">
          <h3>Steps so far</h3>
          <div id="steps-list"></div>
        </div>

      </div>
    </div>
  </div>

</div>

<script>
// ---------------------------------------------------------------------
// Reporting: sends each answered question to the backend so the admin
// page can see marks. Fails silently (logged to console) if the
// backend isn't reachable, so the game still works offline.
// ---------------------------------------------------------------------
function makeSessionId(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'sess-'+Date.now()+'-'+Math.random().toString(36).slice(2,10);
}
let sessionId=null;

function reportAttempt(data){
  fetch('/api/attempt',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(Object.assign({sessionId},data))
  }).catch(err=>console.warn('Could not save score to server:',err));
}

const STEPS=[
  {key:'B',label:'Brackets',color:'#7c3aed',bg:'#ede9fe',tc:'#3b0764'},
  {key:'O',label:'Orders',color:'#d97706',bg:'#fef3c7',tc:'#78350f'},
  {key:'D',label:'Division',color:'#be185d',bg:'#fce7f3',tc:'#831843'},
  {key:'M',label:'Multiply',color:'#0891b2',bg:'#cffafe',tc:'#164e63'},
  {key:'A',label:'Addition',color:'#16a34a',bg:'#dcfce7',tc:'#14532d'},
  {key:'S',label:'Subtraction',color:'#dc2626',bg:'#fee2e2',tc:'#7f1d1d'},
];
const ICONS={B:'( )',O:'xⁿ',D:'÷',M:'×',A:'+',S:'−'};

const ALL_EXPRS=[
  {expr:'(2+3) × 4',steps:[{type:'B',op:'(2+3)',result:'5',before:'(2+3) × 4',after:'5 × 4',why:'Brackets first: 2 + 3 = 5'},{type:'M',op:'5 × 4',result:'20',before:'5 × 4',after:'20',why:'Now multiply: 5 × 4 = 20'}],final:20},
  {expr:'10 + 2 × 3',steps:[{type:'M',op:'2 × 3',result:'6',before:'10 + 2 × 3',after:'10 + 6',why:'Multiply first: 2 × 3 = 6'},{type:'A',op:'10 + 6',result:'16',before:'10 + 6',after:'16',why:'Now add: 10 + 6 = 16'}],final:16},
  {expr:'(6−2)² ÷ 4',steps:[{type:'B',op:'(6−2)',result:'4',before:'(6−2)² ÷ 4',after:'4² ÷ 4',why:'Brackets first: 6 − 2 = 4'},{type:'O',op:'4²',result:'16',before:'4² ÷ 4',after:'16 ÷ 4',why:'Orders next: 4² = 16'},{type:'D',op:'16 ÷ 4',result:'4',before:'16 ÷ 4',after:'4',why:'Divide last: 16 ÷ 4 = 4'}],final:4},
  {expr:'20 − 3 × (1+5)',steps:[{type:'B',op:'(1+5)',result:'6',before:'20 − 3 × (1+5)',after:'20 − 3 × 6',why:'Brackets first: 1 + 5 = 6'},{type:'M',op:'3 × 6',result:'18',before:'20 − 3 × 6',after:'20 − 18',why:'Multiply next: 3 × 6 = 18'},{type:'S',op:'20 − 18',result:'2',before:'20 − 18',after:'2',why:'Subtract last: 20 − 18 = 2'}],final:2},
  {expr:'8 + 4 ÷ 2 − 1',steps:[{type:'D',op:'4 ÷ 2',result:'2',before:'8 + 4 ÷ 2 − 1',after:'8 + 2 − 1',why:'Divide first: 4 ÷ 2 = 2'},{type:'A',op:'8 + 2',result:'10',before:'8 + 2 − 1',after:'10 − 1',why:'Add next: 8 + 2 = 10'},{type:'S',op:'10 − 1',result:'9',before:'10 − 1',after:'9',why:'Subtract last: 10 − 1 = 9'}],final:9},
  {expr:'3 × (4 + 2) − 5',steps:[{type:'B',op:'(4+2)',result:'6',before:'3 × (4+2) − 5',after:'3 × 6 − 5',why:'Brackets first: 4 + 2 = 6'},{type:'M',op:'3 × 6',result:'18',before:'3 × 6 − 5',after:'18 − 5',why:'Multiply next: 3 × 6 = 18'},{type:'S',op:'18 − 5',result:'13',before:'18 − 5',after:'13',why:'Subtract last: 18 − 5 = 13'}],final:13},
  {expr:'5 + 12 ÷ 4',steps:[{type:'D',op:'12 ÷ 4',result:'3',before:'5 + 12 ÷ 4',after:'5 + 3',why:'Divide first: 12 ÷ 4 = 3'},{type:'A',op:'5 + 3',result:'8',before:'5 + 3',after:'8',why:'Now add: 5 + 3 = 8'}],final:8},
  {expr:'(10 − 4) ÷ 3 + 1',steps:[{type:'B',op:'(10−4)',result:'6',before:'(10−4) ÷ 3 + 1',after:'6 ÷ 3 + 1',why:'Brackets first: 10 − 4 = 6'},{type:'D',op:'6 ÷ 3',result:'2',before:'6 ÷ 3 + 1',after:'2 + 1',why:'Divide next: 6 ÷ 3 = 2'},{type:'A',op:'2 + 1',result:'3',before:'2 + 1',after:'3',why:'Add last: 2 + 1 = 3'}],final:3},
  {expr:'15 − 2 × 4 + 3',steps:[{type:'M',op:'2 × 4',result:'8',before:'15 − 2 × 4 + 3',after:'15 − 8 + 3',why:'Multiply first: 2 × 4 = 8'},{type:'S',op:'15 − 8',result:'7',before:'15 − 8 + 3',after:'7 + 3',why:'Subtract next: 15 − 8 = 7'},{type:'A',op:'7 + 3',result:'10',before:'7 + 3',after:'10',why:'Add last: 7 + 3 = 10'}],final:10},
  {expr:'(3+7) × (8−3)',steps:[{type:'B',op:'(3+7)',result:'10',before:'(3+7) × (8−3)',after:'10 × (8−3)',why:'Left bracket: 3 + 7 = 10'},{type:'B',op:'(8−3)',result:'5',before:'10 × (8−3)',after:'10 × 5',why:'Right bracket: 8 − 3 = 5'},{type:'M',op:'10 × 5',result:'50',before:'10 × 5',after:'50',why:'Multiply last: 10 × 5 = 50'}],final:50},
  {expr:'6 × 3 − 4 × 2',steps:[{type:'M',op:'6 × 3',result:'18',before:'6 × 3 − 4 × 2',after:'18 − 4 × 2',why:'Multiply first (left): 6 × 3 = 18'},{type:'M',op:'4 × 2',result:'8',before:'18 − 4 × 2',after:'18 − 8',why:'Multiply next: 4 × 2 = 8'},{type:'S',op:'18 − 8',result:'10',before:'18 − 8',after:'10',why:'Subtract last: 18 − 8 = 10'}],final:10},
  {expr:'24 ÷ (2+4) × 2',steps:[{type:'B',op:'(2+4)',result:'6',before:'24 ÷ (2+4) × 2',after:'24 ÷ 6 × 2',why:'Brackets first: 2 + 4 = 6'},{type:'D',op:'24 ÷ 6',result:'4',before:'24 ÷ 6 × 2',after:'4 × 2',why:'Divide next: 24 ÷ 6 = 4'},{type:'M',op:'4 × 2',result:'8',before:'4 × 2',after:'8',why:'Multiply last: 4 × 2 = 8'}],final:8},
  {expr:'(5+3) × 2 − 6',steps:[{type:'B',op:'(5+3)',result:'8',before:'(5+3) × 2 − 6',after:'8 × 2 − 6',why:'Brackets first: 5 + 3 = 8'},{type:'M',op:'8 × 2',result:'16',before:'8 × 2 − 6',after:'16 − 6',why:'Multiply next: 8 × 2 = 16'},{type:'S',op:'16 − 6',result:'10',before:'16 − 6',after:'10',why:'Subtract last: 16 − 6 = 10'}],final:10},
  {expr:'18 ÷ 3 + 4 × 2',steps:[{type:'D',op:'18 ÷ 3',result:'6',before:'18 ÷ 3 + 4 × 2',after:'6 + 4 × 2',why:'Divide first: 18 ÷ 3 = 6'},{type:'M',op:'4 × 2',result:'8',before:'6 + 4 × 2',after:'6 + 8',why:'Multiply next: 4 × 2 = 8'},{type:'A',op:'6 + 8',result:'14',before:'6 + 8',after:'14',why:'Add last: 6 + 8 = 14'}],final:14},
  {expr:'7 + (9−5) × 3',steps:[{type:'B',op:'(9−5)',result:'4',before:'7 + (9−5) × 3',after:'7 + 4 × 3',why:'Brackets first: 9 − 5 = 4'},{type:'M',op:'4 × 3',result:'12',before:'7 + 4 × 3',after:'7 + 12',why:'Multiply next: 4 × 3 = 12'},{type:'A',op:'7 + 12',result:'19',before:'7 + 12',after:'19',why:'Add last: 7 + 12 = 19'}],final:19},
];

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
let EXPRS=[];
let score=0;
let busy=false;
let studentName='';

// DOM refs
const loginScreen=document.getElementById('login-screen');
const gameScreen=document.getElementById('game-screen');
const nameInput=document.getElementById('name-input');
const nameError=document.getElementById('name-error');
const startBtn=document.getElementById('start-btn');
const studentNameEl=document.getElementById('student-name');
const scoreVal=document.getElementById('score-val');
const logoutBtn=document.getElementById('logout-btn');
const stepTrack=document.getElementById('step-track');
const exprPanel=document.querySelector('.expr-panel');
const stepsList=document.getElementById('steps-list');
const statusIcon=document.getElementById('status-icon');
const statusText=document.getElementById('status-text');
const answerUI=document.getElementById('answer-ui');
const questionDisplay=document.getElementById('question-display');
const answerInput=document.getElementById('answer-input');
const submitBtn=document.getElementById('submit-btn');
const answerFeedback=document.getElementById('answer-feedback');
const exprBox=document.getElementById('expr-box');
const opArea=document.getElementById('op-area');
const opPill=document.getElementById('op-pill');
const opBadge=document.getElementById('op-badge');
const resultBubble=document.getElementById('result-bubble');
const finalCard=document.getElementById('final-card');

// Build step track
STEPS.forEach(s=>{
  const d=document.createElement('div');
  d.className='step-hdr';d.id='sh-'+s.key;
  d.style.background=s.bg;d.style.borderBottom='3px solid '+s.color;
  d.innerHTML=`<div class="step-key" style="color:${s.tc}">${ICONS[s.key]}</div><div class="step-key" style="font-size:11px;color:${s.tc}">${s.key}</div><div class="step-name" style="color:${s.tc}">${s.label}</div>`;
  stepTrack.appendChild(d);
});

// LOGIN
startBtn.addEventListener('click',doLogin);
nameInput.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

function doLogin(){
  const n=nameInput.value.trim();
  if(!n){nameError.style.display='block';nameInput.focus();return;}
  nameError.style.display='none';
  studentName=n;
  studentNameEl.textContent=n;
  sessionId=makeSessionId();
  score=0;scoreVal.textContent='0';
  loginScreen.style.display='none';
  gameScreen.style.display='flex';
  initGame();
}

logoutBtn.addEventListener('click',()=>{
  gameScreen.style.display='none';
  loginScreen.style.display='flex';
  nameInput.value='';
  exprPanel.querySelectorAll('.expr-btn').forEach(b=>b.remove());
  stepsList.innerHTML='';
  busy=false;
});

function initGame(){
  EXPRS=shuffle(ALL_EXPRS).slice(0,5);
  exprPanel.querySelectorAll('.expr-btn').forEach(b=>b.remove());
  stepsList.innerHTML='';
  score=0;scoreVal.textContent='0';
  setStatus('💡','Pick a question on the left to begin!');
  hideExplanation();
  answerUI.style.display='none';
  EXPRS.forEach((ex,i)=>{
    const btn=document.createElement('div');
    btn.className='expr-btn';
    btn.setAttribute('role','button');btn.setAttribute('tabindex','0');
    btn.dataset.idx=i;
    btn.innerHTML=`<div class="expr-math">${ex.expr}</div><span class="expr-tick" id="tick-${i}"></span>`;
    btn.addEventListener('click',()=>pickQuestion(ex,btn,i));
    btn.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pickQuestion(ex,btn,i);}});
    exprPanel.appendChild(btn);
  });
}

function pickQuestion(ex,btn,idx){
  if(busy)return;
  if(btn.classList.contains('answered-correct')||btn.classList.contains('locked'))return;
  busy=true;
  document.querySelectorAll('.expr-btn').forEach(b=>b.classList.add('locked'));
  btn.classList.remove('locked');
  stepsList.innerHTML='';
  hideExplanation();
  setStatus('🤔',studentName+', what is the answer to: '+ex.expr+' ?');
  showAnswerUI(ex,btn,idx);
}

function showAnswerUI(ex,btn,idx){
  questionDisplay.textContent=ex.expr;
  answerInput.value='';
  answerFeedback.textContent='';
  answerFeedback.style.color='';
  answerFeedback.style.background='';
  answerUI.style.display='flex';
  answerInput.focus();

  function onSubmit(){
    const val=answerInput.value.trim();
    if(val===''){answerFeedback.style.color='#d97706';answerFeedback.textContent='Please type your answer!';return;}
    const num=Number(val);
    submitBtn.removeEventListener('click',onSubmit);
    answerInput.removeEventListener('keydown',keyHandler);

    const correct=(num===ex.final);
    const pointsAwarded=correct?10:0;

    if(correct){
      score+=10;scoreVal.textContent=score;
      answerFeedback.style.color='#14532d';answerFeedback.style.background='#dcfce7';
      answerFeedback.textContent='✅ Correct! +10 points — Now watch how it works!';
      btn.classList.remove('locked');btn.classList.add('answered-correct');
      document.getElementById('tick-'+idx).textContent='✅';
    } else {
      answerFeedback.style.color='#7f1d1d';answerFeedback.style.background='#fee2e2';
      answerFeedback.textContent='❌ Not quite! The answer is '+ex.final+'. Watch the steps!';
      btn.classList.remove('locked');btn.classList.add('answered-wrong');
      document.getElementById('tick-'+idx).textContent='❌';
    }

    reportAttempt({
      studentName:studentName,
      expr:ex.expr,
      submittedAnswer:num,
      correctAnswer:ex.final,
      isCorrect:correct,
      points:pointsAwarded
    });

    setTimeout(()=>{
      answerUI.style.display='none';
      document.querySelectorAll('.expr-btn').forEach(b=>b.classList.remove('locked'));
      runExplanation(ex);
    },1600);
  }

  function keyHandler(e){if(e.key==='Enter')onSubmit();}
  submitBtn.addEventListener('click',onSubmit);
  answerInput.addEventListener('keydown',keyHandler);
}

function setStatus(icon,text){statusIcon.textContent=icon;statusText.textContent=text;}

function highlightStep(key){
  STEPS.forEach(s=>{
    const el=document.getElementById('sh-'+s.key);if(!el)return;
    if(s.key===key){el.style.transform='scaleY(1.12)';el.style.outline='3px solid '+s.color;el.style.opacity='1';el.style.zIndex='5';}
    else{el.style.transform='';el.style.outline='none';el.style.opacity='.4';el.style.zIndex='';}
  });
}
function resetHighlight(){STEPS.forEach(s=>{const el=document.getElementById('sh-'+s.key);if(el){el.style.transform='';el.style.outline='none';el.style.opacity='1';el.style.zIndex='';}}); }

function hideExplanation(){
  exprBox.style.display='none';
  opArea.style.opacity='0';
  resultBubble.style.opacity='0';
  finalCard.style.opacity='0';finalCard.style.transform='translate(-50%,-50%) scale(0)';
  resetHighlight();
}

function addStepCard(st,s){
  const item=document.createElement('div');item.className='res-item active';
  item.style.borderColor=s.color;
  item.innerHTML=`<div class="res-step-name" style="color:${s.tc}">${ICONS[s.key]} ${s.label}</div><div class="res-expr">${st.before}</div><div class="res-result" style="color:${s.tc}">= ${st.result}</div>`;
  stepsList.appendChild(item);
  item.scrollIntoView({block:'nearest',behavior:'smooth'});
}

function wait(ms){return new Promise(r=>setTimeout(r,ms));}
function animOp(el,from,to,dur){return new Promise(r=>{el.style.opacity=from;const t0=performance.now();(function step(now){const t=Math.min((now-t0)/dur,1);el.style.opacity=String(from+(to-from)*t);if(t<1)requestAnimationFrame(step);else r();})(performance.now());});}

async function runExplanation(ex){
  setStatus('📖','Let\'s see how '+ex.expr+' = '+ex.final+' step by step!');
  exprBox.style.display='block';
  exprBox.textContent=ex.expr;
  exprBox.style.borderColor='#3b82f6';exprBox.style.color='#1e40af';
  opArea.style.opacity='0';resultBubble.style.opacity='0';
  await wait(700);

  for(let idx=0;idx<ex.steps.length;idx++){
    const st=ex.steps[idx];
    const s=STEPS.find(s=>s.key===st.type);
    highlightStep(st.type);
    setStatus(ICONS[st.type],'Step '+(idx+1)+': '+st.why);
    exprBox.textContent=st.before;
    exprBox.style.borderColor=s.color;exprBox.style.color=s.tc;
    await wait(700);
    opPill.textContent=st.op;opPill.style.background=s.bg;opPill.style.borderColor=s.color;opPill.style.color=s.tc;
    opBadge.textContent=s.label;opBadge.style.background=s.bg;opBadge.style.borderColor=s.color;opBadge.style.color=s.tc;
    await animOp(opArea,0,1,400);
    await wait(1000);
    resultBubble.textContent='= '+st.result;
    resultBubble.style.background=s.bg;resultBubble.style.borderColor=s.color;resultBubble.style.color=s.tc;
    await animOp(resultBubble,0,1,400);
    await wait(900);
    addStepCard(st,s);
    await wait(600);
    await animOp(opArea,1,0,300);
    await animOp(resultBubble,1,0,300);
    exprBox.textContent=st.after;exprBox.style.borderColor='#3b82f6';exprBox.style.color='#1e40af';
    await wait(900);
  }

  resetHighlight();
  await showFinal(ex);
  await wait(3500);
  await animOp(finalCard,1,0,500);
  finalCard.style.transform='translate(-50%,-50%) scale(0)';
  exprBox.style.display='none';
  setStatus('💡','Great job! Pick another question!');
  busy=false;
}

async function showFinal(ex){
  setStatus('✅',ex.expr+' = '+ex.final+' — Well done, '+studentName+'!');
  finalCard.setAttribute('aria-label','Final answer: '+ex.final);
  finalCard.innerHTML=`<div style="font-size:11px;color:#16a34a;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px">Final Answer</div><div style="font-size:13px;color:#475569;font-family:monospace;margin-bottom:4px">${ex.expr}</div><div style="font-size:30px;font-weight:800;color:#14532d;font-family:monospace">= ${ex.final}</div>`;
  finalCard.style.opacity='0';finalCard.style.transform='translate(-50%,-50%) scale(0.3)';
  const anim=document.getElementById('anim-area');
  const cx=anim.offsetWidth/2,cy=anim.offsetHeight/2;
  const cols=['#7c3aed','#d97706','#be185d','#0891b2','#16a34a'];
  const parts=[];
  for(let i=0;i<14;i++){
    const p=document.createElement('div');p.className='confetti-dot';
    const sz=5+Math.random()*8;p.style.width=p.style.height=sz+'px';
    p.style.background=cols[i%5];p.style.left=cx+'px';p.style.top=cy+'px';
    anim.appendChild(p);parts.push(p);
  }
  return new Promise(r=>{
    const t0=performance.now();
    (function tick(now){
      const t=Math.min((now-t0)/800,1),e=1-Math.pow(1-t,3);
      parts.forEach((p,i)=>{const angle=(i/parts.length)*Math.PI*2,dist=e*55;p.style.left=(cx+Math.cos(angle)*dist)+'px';p.style.top=(cy+Math.sin(angle)*dist)+'px';p.style.opacity=String(1-e*.9);});
      finalCard.style.opacity=String(Math.min(t*2.5,1));
      finalCard.style.transform=`translate(-50%,-50%) scale(${0.3+e*0.7})`;
      if(t<1)requestAnimationFrame(tick);else{parts.forEach(p=>p.remove());r();}
    })(performance.now());
  });
}
</script>
